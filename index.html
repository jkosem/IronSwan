<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#040209">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Book Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div class="container">
        <div class="cover">
            <img src="images/cover-image.jpg" alt="Book Cover" class="cover-image" width="320" height="427" fetchpriority="high">
            <h1 id="book-title">Book Title</h1>
            <p id="book-author">by Author Name</p>
        </div>

        <main class="toc">
            <h2>Table of Contents</h2>
            <ul class="toc-list">
                <!-- TOC will be generated here -->
            </ul>
        </main>

        <footer>
            <p id="book-copyright"></p>
        </footer>
    </div>

    <script type="module">
        import config from './js/config.js';
        import tocGenerator from './js/toc-generator.js';
        import stateManager from './js/state-manager.js';

        // Update page with book info
        document.getElementById('book-title').textContent = config.title;
        document.getElementById('book-author').textContent = `by ${config.author}`;
        document.getElementById('book-copyright').textContent = config.copyright;
        document.title = `${config.title} - Table of Contents`;

        // Generate TOC
        tocGenerator.generateTOC();

        // Check for last read chapter
        const lastChapterId = stateManager.getLastChapter();
        if (lastChapterId) {
            const chapter = config.chapters.find(c => c.id === lastChapterId);
            const chapterTitle = chapter ? chapter.title : `Chapter ${lastChapterId}`;
            const resumeReading = document.createElement('div');
            resumeReading.className = 'resume-reading';
            resumeReading.innerHTML = `
                    <a href="chapter-${lastChapterId}.html" class="nav-link">
                        Resume Reading: ${chapterTitle}
                    </a>
                `;
            document.querySelector('.toc').insertBefore(
                resumeReading,
                document.querySelector('.toc-list')
            );
        }
    </script>
</body>
</html>
